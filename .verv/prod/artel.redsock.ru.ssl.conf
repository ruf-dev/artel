server {
    listen 443 ssl;

    server_name artel.redsock.ru;

    ssl_certificate /etc/angie/ssl/live/artel.redsock.ru/fullchain.pem;
    ssl_certificate_key /etc/angie/ssl/live/artel.redsock.ru/privkey.pem;
    ssl_trusted_certificate /etc/angie/ssl/live/artel.redsock.ru/chain.pem;

    location / {
         proxy_pass http://artel-prod:5174;
         proxy_set_header Host artel.redsock.ru;
 	     proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_set_header X-Forwarded-Host $host;
         proxy_set_header X-Forwarded-Port $server_port;

         proxy_set_header X-Original-Method $request_method;
         proxy_set_header X-Request-Method $request_method;

        # WebSocket support
         proxy_http_version 1.1;
         proxy_set_header Upgrade $http_upgrade;
         proxy_set_header Connection "upgrade";
    }

    location /mcp {
         proxy_pass http://100.64.0.3:1551;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_set_header X-Forwarded-Host $host;
         proxy_set_header X-Forwarded-Port $server_port;

         proxy_set_header X-Original-Method $request_method;
         proxy_set_header X-Request-Method $request_method;
    }
}

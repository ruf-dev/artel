server {
    listen 443 ssl;

    server_name artel-alexskilled.redsock.ru;

    ssl_certificate /etc/angie/ssl/live/artel-alexskilled.redsock.ru/fullchain.pem;
    ssl_certificate_key /etc/angie/ssl/live/artel-alexskilled.redsock.ru/privkey.pem;
    ssl_trusted_certificate /etc/angie/ssl/live/artel-alexskilled.redsock.ru/chain.pem;

    location / {
         proxy_pass http://artel-alexskilled-frontend;
         proxy_set_header Host artel-alexskilled.redsock.ru;
 	     proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_set_header X-Forwarded-Host $host;
         proxy_set_header X-Forwarded-Port $server_port;

         proxy_set_header X-Original-Method $request_method;
         proxy_set_header X-Request-Method $request_method;

        # WebSocket support
         proxy_http_version 1.1;
         proxy_set_header Upgrade $http_upgrade;
         proxy_set_header Connection "upgrade";
    }

    location = /mcp {
         proxy_pass http://artel-alexskilled-server;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_set_header X-Forwarded-Host $host;
         proxy_set_header X-Forwarded-Port $server_port;

         proxy_set_header X-Original-Method $request_method;
         proxy_set_header X-Request-Method $request_method;

         # SSE / Streamable HTTP support
         proxy_http_version 1.1;
         proxy_set_header Connection "";
         proxy_buffering off;
         proxy_cache off;
         proxy_read_timeout 3600s;
    }

    location /.well-known/ {
         proxy_pass http://artel-alexskilled-server;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_set_header X-Forwarded-Host $host;
         proxy_set_header X-Forwarded-Port $server_port;
    }

    location /authorize {
         proxy_pass http://artel-alexskilled-frontend;
         proxy_set_header Host artel-alexskilled.redsock.ru;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_set_header X-Forwarded-Host $host;
         proxy_set_header X-Forwarded-Port $server_port;
         proxy_http_version 1.1;
         proxy_set_header Upgrade $http_upgrade;
         proxy_set_header Connection "upgrade";
    }

    location /oauth/ {
         proxy_pass http://artel-alexskilled-server;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_set_header X-Forwarded-Host $host;
         proxy_set_header X-Forwarded-Port $server_port;
    }

    location /register {
         proxy_pass http://artel-alexskilled-server;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_set_header X-Forwarded-Host $host;
         proxy_set_header X-Forwarded-Port $server_port;
    }

    location /token {
         proxy_pass http://artel-alexskilled-server;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_set_header X-Forwarded-Host $host;
         proxy_set_header X-Forwarded-Port $server_port;
    }

      location /api {
         proxy_pass http://artel-alexskilled-server;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_set_header X-Forwarded-Host $host;
         proxy_set_header X-Forwarded-Port $server_port;
    }

    location /webhooks/ {
         proxy_pass http://artel-alexskilled-server;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_set_header X-Forwarded-Host $host;
         proxy_set_header X-Forwarded-Port $server_port;
    }
}

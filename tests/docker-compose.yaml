services:
  test-couchdb:
    image: apache/couchdb:3
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin
    ports:
      - "15985:5984"

  test-postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: artel
      POSTGRES_DB: artel_db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "15434:5432"

  test-minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    ports:
      - "19000:9000"

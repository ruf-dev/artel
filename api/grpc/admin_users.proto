syntax = "proto3";

package artel_admin_users;

import "google/api/annotations.proto";
import "npm.proto";
import "google/protobuf/timestamp.proto";

option go_package = "/artel_api";
option (npm_package) = "@artel/api";

service AdminUsersAPI {
  rpc ListArtelUsers(ListArtelUsers.Request) returns (ListArtelUsers.Response) {
    option (google.api.http) = {
      post: "/api/admin_users/list"
      body: "*"
    };
  };
  rpc GetArtelUser(GetArtelUser.Request) returns (GetArtelUser.Response) {
    option (google.api.http) = {
      post: "/api/admin_users/get"
      body: "*"
    };
  };
  rpc GetUserSessions(GetUserSessions.Request) returns (GetUserSessions.Response) {
    option (google.api.http) = {
      post: "/api/admin_users/sessions"
      body: "*"
    };
  };
}

message ArtelUserEntry {
  string user_id = 1;
  string username = 2;
  string email = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ListArtelUsers {
  message Request {
    string search = 1;
    uint32 limit = 2;
    uint32 offset = 3;
  }
  message Response {
    repeated ArtelUserEntry users = 1;
    int64 total = 2;
  }
}

message ArtelUserDetails {
  string user_id = 1;
  string username = 2;
  string email = 3;
  bool is_administrator = 4;
  bool has_emails = 5;
  bool has_task_trackers = 6;
  bool has_notes = 7;
  bool subscription_active = 8;
}

message GetArtelUser {
  message Request {
    string user_id = 1;
  }
  message Response {
    ArtelUserDetails user = 1;
  }
}

message UserSession {
  string session_id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message GetUserSessions {
  message Request {
    string user_id = 1;
  }
  message Response {
    repeated UserSession sessions = 1;
  }
}

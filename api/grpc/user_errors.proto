syntax = "proto3";

package artel_api;

import "npm.proto";

option go_package = "/artel_api";
option (npm_package) = "@artel/api";

enum UserErrors {
  UndefinedError = 0;

  NoSubscription = 1;
  NoCouchDbInstance = 2;
  NoS3BucketLinked = 3; // vault has no linked S3 bucket; non-markdown file ops are unavailable
}
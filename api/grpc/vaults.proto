syntax = "proto3";

package artel_vaults;

import "google/api/annotations.proto";
import "npm.proto";

option go_package = "/artel_api";
option (npm_package) = "@artel/api";

service VaultsAPI {
  rpc CreateVault(CreateVault.Request) returns (CreateVault.Response) {
    option (google.api.http) = {
      post: "/api/vaults/create"
      body: "*"
    };
  };
  rpc GetVault(GetVault.Request) returns (GetVault.Response) {
    option (google.api.http) = {
      post: "/api/vaults/get"
      body: "*"
    };
  };
  rpc ListVaults(ListVaults.Request) returns (ListVaults.Response) {
    option (google.api.http) = {
      post: "/api/vaults/list"
      body: "*"
    };
  };
  rpc DeleteVault(DeleteVault.Request) returns (DeleteVault.Response) {
    option (google.api.http) = {
      post: "/api/vaults/delete"
      body: "*"
    };
  };
  rpc AddMember(AddMember.Request) returns (AddMember.Response) {
    option (google.api.http) = {
      post: "/api/vaults/members/add"
      body: "*"
    };
  };
  rpc RemoveMember(RemoveMember.Request) returns (RemoveMember.Response) {
    option (google.api.http) = {
      post: "/api/vaults/members/remove"
      body: "*"
    };
  };
  rpc ListMembers(ListMembers.Request) returns (ListMembers.Response) {
    option (google.api.http) = {
      post: "/api/vaults/members/list"
      body: "*"
    };
  };
  rpc CreateInviteLink(CreateInviteLink.Request) returns (CreateInviteLink.Response) {
    option (google.api.http) = {
      post: "/api/vaults/invites/create"
      body: "*"
    };
  };
  rpc ListInviteLinks(ListInviteLinks.Request) returns (ListInviteLinks.Response) {
    option (google.api.http) = {
      post: "/api/vaults/invites/list"
      body: "*"
    };
  };
  rpc RevokeInviteLink(RevokeInviteLink.Request) returns (RevokeInviteLink.Response) {
    option (google.api.http) = {
      post: "/api/vaults/invites/revoke"
      body: "*"
    };
  };
  rpc AcceptInvite(AcceptInvite.Request) returns (AcceptInvite.Response) {
    option (google.api.http) = {
      post: "/api/vaults/join"
      body: "*"
    };
  };
  rpc LinkS3Bucket(LinkS3Bucket.Request) returns (LinkS3Bucket.Response) {
    option (google.api.http) = {
      post: "/api/vaults/s3/link"
      body: "*"
    };
  };
  rpc UnlinkS3Bucket(UnlinkS3Bucket.Request) returns (UnlinkS3Bucket.Response) {
    option (google.api.http) = {
      post: "/api/vaults/s3/unlink"
      body: "*"
    };
  };
  rpc SetVaultBinaryStorage(SetVaultBinaryStorage.Request) returns (SetVaultBinaryStorage.Response) {
    option (google.api.http) = {
      post: "/api/vaults/binary-storage"
      body: "*"
    };
  };
  rpc CreateWorkbench(CreateWorkbench.Request) returns (CreateWorkbench.Response) {
    option (google.api.http) = {
      post: "/api/vaults/workbench/create"
      body: "*"
    };
  };
  rpc StartWorkbench(StartWorkbench.Request) returns (StartWorkbench.Response) {
    option (google.api.http) = {
      post: "/api/vaults/workbench/start"
      body: "*"
    };
  };
  rpc StopWorkbench(StopWorkbench.Request) returns (StopWorkbench.Response) {
    option (google.api.http) = {
      post: "/api/vaults/workbench/stop"
      body: "*"
    };
  };
  // WatchWorkbenchLogin streams periodic snapshots of the subscription_login TUI flow's state
  // (docs/workbench/03_auth_and_login_flow.md) until it reaches "authorized" or the client
  // disconnects. Modeled on TractsAPI.WatchRun.
  rpc WatchWorkbenchLogin(WatchWorkbenchLogin.Request) returns (stream WatchWorkbenchLogin.Response) {
    option (google.api.http) = {
      post: "/api/vaults/workbench/login/watch"
      body: "*"
    };
  };
  rpc SubmitWorkbenchLoginCode(SubmitWorkbenchLoginCode.Request) returns (SubmitWorkbenchLoginCode.Response) {
    option (google.api.http) = {
      post: "/api/vaults/workbench/login/submit"
      body: "*"
    };
  };
}

message CreateVault {
  message Request {
    string name = 1;
  }
  message Response {
    string id = 1;
    string name = 2;
    string db_url = 3;
  }
}

message GetVault {
  message Request {
    string id = 1;
  }
  message Response {
    string id = 1;
    string name = 2;
    string db_url = 3;
    string s3_instance_id = 4;
    string s3_bucket_name = 5;
    // workbench_exists is false when no workbenches row backs this vault yet — either the vault
    // predates this feature, or WorkbenchDockerHost isn't configured for this deployment.
    // workbench_status is only meaningful when workbench_exists is true; one of
    // "created"/"configuring"/"running"/"stopped"/"removed" (see domain.WorkbenchStatus).
    bool workbench_exists = 6;
    string workbench_status = 7;
  }
}

message ListVaults {
  message Request {}
  message Response {
    repeated VaultItem vaults = 1;
  }
}

message DeleteVault {
  message Request {
    string id = 1;
  }
  message Response {}
}

message AddMember {
  message Request {
    string vault_id = 1;
    string user_id = 2;
    string role = 3;
  }
  message Response {}
}

message RemoveMember {
  message Request {
    string vault_id = 1;
    string user_id = 2;
  }
  message Response {}
}

message ListMembers {
  message Request {
    string vault_id = 1;
  }
  message Response {
    repeated VaultMemberInfo members = 1;
  }
}

message CreateInviteLink {
  message Request {
    string vault_id = 1;
    string role = 2;
  }
  message Response {
    VaultInviteItem invite = 1;
  }
}

message ListInviteLinks {
  message Request {
    string vault_id = 1;
  }
  message Response {
    repeated VaultInviteItem invites = 1;
  }
}

message RevokeInviteLink {
  message Request {
    string vault_id = 1;
    string invite_id = 2;
  }
  message Response {}
}

message AcceptInvite {
  message Request {
    string token = 1;
  }
  message Response {
    string vault_id = 1;
  }
}

message LinkS3Bucket {
  message Request {
    string vault_id = 1;
    string s3_instance_id = 2;
    string bucket_name = 3;
  }
  message Response {}
}

message UnlinkS3Bucket {
  message Request {
    string vault_id = 1;
  }
  message Response {}
}

message SetVaultBinaryStorage {
  message Request {
    string vault_id = 1;
    bool use_couchdb = 2;
  }
  message Response {}
}

message CreateWorkbench {
  message Request {
    string vault_id = 1;
  }
  message Response {
    // status: "created"/"running"/"configuring"/"stopped"/"removed" (see domain.WorkbenchStatus).
    string status = 1;
  }
}

message StartWorkbench {
  message Request {
    string vault_id = 1;
    // auth_mode: "api_key" or "subscription_login" (see domain.WorkbenchAuthMode). Only
    // "api_key" is currently implemented — any other value fails with
    // user_errors.WorkbenchAuthModeNotImplemented.
    string auth_mode = 2;
  }
  message Response {
    // status: "created"/"configuring"/"running"/"stopped"/"removed" (see domain.WorkbenchStatus).
    string status = 1;
    string auth_mode = 2;
  }
}

message StopWorkbench {
  message Request {
    string vault_id = 1;
  }
  message Response {
    // status: "created"/"configuring"/"running"/"stopped"/"removed" (see domain.WorkbenchStatus).
    string status = 1;
  }
}

message WatchWorkbenchLogin {
  message Request {
    string vault_id = 1;
  }
  message Response {
    // state: "pending"/"url_present"/"error"/"authorized" (see domain.WorkbenchLoginState).
    string state = 1;
    // url is only set when state == "url_present".
    string url = 2;
    // error_message is only set when state == "error".
    string error_message = 3;
  }
}

message SubmitWorkbenchLoginCode {
  message Request {
    string vault_id = 1;
    // code is relayed verbatim into the workbench's tmux session — an OAuth code pasted from
    // Anthropic's hosted callback page, or (on a brand-new container) the user's first
    // theme/login-menu keystroke. See docs/workbench/03_auth_and_login_flow.md.
    string code = 2;
  }
  message Response {}
}

message VaultItem {
  string id = 1;
  string name = 2;
  string db_url = 3;
  string livesync_passphrase = 4;
  string s3_instance_id = 5;
  string s3_bucket_name = 6;
  bool use_couchdb_for_binaries = 7;
}

message VaultMemberInfo {
  string id = 1;
  string user_id = 2;
  string email = 3;
  string username = 4;
  string role = 5;
}

message VaultInviteItem {
  string id = 1;
  string vault_id = 2;
  string role = 3;
  string token = 4;
  bool revoked = 5;
  string created_at = 6;
}

syntax = "proto3";

package artel_vaults;

import "google/api/annotations.proto";
import "npm.proto";

option go_package = "/artel_api";
option (npm_package) = "@artel/api";

service VaultsAPI {
  rpc CreateVault(CreateVault.Request) returns (CreateVault.Response) {
    option (google.api.http) = {
      post: "/api/vaults/create"
      body: "*"
    };
  };
  rpc GetVault(GetVault.Request) returns (GetVault.Response) {
    option (google.api.http) = {
      post: "/api/vaults/get"
      body: "*"
    };
  };
  rpc ListVaults(ListVaults.Request) returns (ListVaults.Response) {
    option (google.api.http) = {
      post: "/api/vaults/list"
      body: "*"
    };
  };
  rpc DeleteVault(DeleteVault.Request) returns (DeleteVault.Response) {
    option (google.api.http) = {
      post: "/api/vaults/delete"
      body: "*"
    };
  };
  rpc AddMember(AddMember.Request) returns (AddMember.Response) {
    option (google.api.http) = {
      post: "/api/vaults/members/add"
      body: "*"
    };
  };
  rpc RemoveMember(RemoveMember.Request) returns (RemoveMember.Response) {
    option (google.api.http) = {
      post: "/api/vaults/members/remove"
      body: "*"
    };
  };
  rpc ListMembers(ListMembers.Request) returns (ListMembers.Response) {
    option (google.api.http) = {
      post: "/api/vaults/members/list"
      body: "*"
    };
  };
  rpc CreateInviteLink(CreateInviteLink.Request) returns (CreateInviteLink.Response) {
    option (google.api.http) = {
      post: "/api/vaults/invites/create"
      body: "*"
    };
  };
  rpc ListInviteLinks(ListInviteLinks.Request) returns (ListInviteLinks.Response) {
    option (google.api.http) = {
      post: "/api/vaults/invites/list"
      body: "*"
    };
  };
  rpc RevokeInviteLink(RevokeInviteLink.Request) returns (RevokeInviteLink.Response) {
    option (google.api.http) = {
      post: "/api/vaults/invites/revoke"
      body: "*"
    };
  };
  rpc AcceptInvite(AcceptInvite.Request) returns (AcceptInvite.Response) {
    option (google.api.http) = {
      post: "/api/vaults/join"
      body: "*"
    };
  };
  rpc LinkS3Bucket(LinkS3Bucket.Request) returns (LinkS3Bucket.Response) {
    option (google.api.http) = {
      post: "/api/vaults/s3/link"
      body: "*"
    };
  };
  rpc UnlinkS3Bucket(UnlinkS3Bucket.Request) returns (UnlinkS3Bucket.Response) {
    option (google.api.http) = {
      post: "/api/vaults/s3/unlink"
      body: "*"
    };
  };
  rpc SetVaultBinaryStorage(SetVaultBinaryStorage.Request) returns (SetVaultBinaryStorage.Response) {
    option (google.api.http) = {
      post: "/api/vaults/binary-storage"
      body: "*"
    };
  };
  rpc PublishVault(PublishVault.Request) returns (PublishVault.Response) {
    option (google.api.http) = {
      post: "/api/vaults/{vault_id}/publish"
      body: "*"
    };
  };
  rpc UnpublishVault(UnpublishVault.Request) returns (UnpublishVault.Response) {
    option (google.api.http) = {
      post: "/api/vaults/{vault_id}/unpublish"
      body: "*"
    };
  };
  rpc CreateWorkbench(CreateWorkbench.Request) returns (CreateWorkbench.Response) {
    option (google.api.http) = {
      post: "/api/vaults/workbench/create"
      body: "*"
    };
  };
  rpc StartWorkbench(StartWorkbench.Request) returns (StartWorkbench.Response) {
    option (google.api.http) = {
      post: "/api/vaults/workbench/start"
      body: "*"
    };
  };
  rpc StopWorkbench(StopWorkbench.Request) returns (StopWorkbench.Response) {
    option (google.api.http) = {
      post: "/api/vaults/workbench/stop"
      body: "*"
    };
  };
  rpc DeleteWorkbench(DeleteWorkbench.Request) returns (DeleteWorkbench.Response) {
    option (google.api.http) = {
      post: "/api/vaults/workbench/delete"
      body: "*"
    };
  };
  rpc ListWorkbenchTerminalTabs(ListWorkbenchTerminalTabs.Request) returns (ListWorkbenchTerminalTabs.Response) {
    option (google.api.http) = {
      post: "/api/vaults/workbench/terminal-tabs/list"
      body: "*"
    };
  };
  rpc CreateWorkbenchTerminalTab(CreateWorkbenchTerminalTab.Request) returns (CreateWorkbenchTerminalTab.Response) {
    option (google.api.http) = {
      post: "/api/vaults/workbench/terminal-tabs/create"
      body: "*"
    };
  };
  rpc SelectWorkbenchTerminalTab(SelectWorkbenchTerminalTab.Request) returns (SelectWorkbenchTerminalTab.Response) {
    option (google.api.http) = {
      post: "/api/vaults/workbench/terminal-tabs/select"
      body: "*"
    };
  };
  rpc CloseWorkbenchTerminalTab(CloseWorkbenchTerminalTab.Request) returns (CloseWorkbenchTerminalTab.Response) {
    option (google.api.http) = {
      post: "/api/vaults/workbench/terminal-tabs/close"
      body: "*"
    };
  };
  rpc EnablePostgresDatabase(EnablePostgresDatabase.Request) returns (EnablePostgresDatabase.Response) {
    option (google.api.http) = {
      post: "/api/vaults/postgres/enable"
      body: "*"
    };
  };
  rpc GetPostgresDatabase(GetPostgresDatabase.Request) returns (GetPostgresDatabase.Response) {
    option (google.api.http) = {
      post: "/api/vaults/postgres/get"
      body: "*"
    };
  };
  rpc DisablePostgresDatabase(DisablePostgresDatabase.Request) returns (DisablePostgresDatabase.Response) {
    option (google.api.http) = {
      post: "/api/vaults/postgres/disable"
      body: "*"
    };
  };
}

message CreateVault {
  message Request {
    string name = 1;
  }
  message Response {
    string id = 1;
    string name = 2;
    string db_url = 3;
  }
}

message GetVault {
  message Request {
    string id = 1;
  }
  message Response {
    string id = 1;
    string name = 2;
    string db_url = 3;
    string s3_instance_id = 4;
    string s3_bucket_name = 5;
    // workbench_exists is false when no workbenches row backs this vault yet — either the vault
    // predates this feature, or the create-vault hook's CreateWorkbench call failed separately
    // (e.g. no docker hosts were registered at the time — see docker_hosts table).
    // workbench_status is only meaningful when workbench_exists is true; one of
    // "created"/"configuring"/"running"/"stopped"/"removed" (see domain.WorkbenchStatus).
    bool workbench_exists = 6;
    string workbench_status = 7;
    // postgres_enabled/postgres_status mirror EnablePostgresDatabase.Response — status is one of
    // "not_enabled"/"provisioning"/"ready"/"error" (see domain.VaultPostgresStatus).
    bool postgres_enabled = 8;
    string postgres_status = 9;
  }
}

message ListVaults {
  message Request {}
  message Response {
    repeated VaultItem vaults = 1;
  }
}

message DeleteVault {
  message Request {
    string id = 1;
  }
  message Response {}
}

message AddMember {
  message Request {
    string vault_id = 1;
    string user_id = 2;
    string role = 3;
  }
  message Response {}
}

message RemoveMember {
  message Request {
    string vault_id = 1;
    string user_id = 2;
  }
  message Response {}
}

message ListMembers {
  message Request {
    string vault_id = 1;
  }
  message Response {
    repeated VaultMemberInfo members = 1;
  }
}

message CreateInviteLink {
  message Request {
    string vault_id = 1;
    string role = 2;
  }
  message Response {
    VaultInviteItem invite = 1;
  }
}

message ListInviteLinks {
  message Request {
    string vault_id = 1;
  }
  message Response {
    repeated VaultInviteItem invites = 1;
  }
}

message RevokeInviteLink {
  message Request {
    string vault_id = 1;
    string invite_id = 2;
  }
  message Response {}
}

message AcceptInvite {
  message Request {
    string token = 1;
  }
  message Response {
    string vault_id = 1;
  }
}

message LinkS3Bucket {
  message Request {
    string vault_id = 1;
    string s3_instance_id = 2;
    string bucket_name = 3;
  }
  message Response {}
}

message UnlinkS3Bucket {
  message Request {
    string vault_id = 1;
  }
  message Response {}
}

message SetVaultBinaryStorage {
  message Request {
    string vault_id = 1;
    bool use_couchdb = 2;
  }
  message Response {}
}

message PublishVault {
  message Request {
    string vault_id = 1;
    // slug: lowercase, [a-z0-9-]+ (validated service-side); must be globally unique across
    // vaults (see migrations/063_vault_public.sql vaults.slug UNIQUE constraint).
    string slug = 2;
  }
  message Response {
    VaultItem vault = 1;
  }
}

message UnpublishVault {
  message Request {
    string vault_id = 1;
  }
  message Response {
    VaultItem vault = 1;
  }
}

message CreateWorkbench {
  message Request {
    string vault_id = 1;
  }
  message Response {
    // status: "created"/"running"/"configuring"/"stopped"/"removed" (see domain.WorkbenchStatus).
    string status = 1;
  }
}

message StartWorkbench {
  message Request {
    string vault_id = 1;
    // auth_mode: "api_key" or "subscription_login" (see domain.WorkbenchAuthMode). Only
    // "api_key" is currently implemented — any other value fails with
    // user_errors.WorkbenchAuthModeNotImplemented.
    string auth_mode = 2;
  }
  message Response {
    // status: "created"/"configuring"/"running"/"stopped"/"removed" (see domain.WorkbenchStatus).
    string status = 1;
    string auth_mode = 2;
  }
}

message StopWorkbench {
  message Request {
    string vault_id = 1;
  }
  message Response {
    // status: "created"/"configuring"/"running"/"stopped"/"removed" (see domain.WorkbenchStatus).
    string status = 1;
    // sync_conflicts lists the paths where a genuine edit conflict was detected while syncing
    // the workbench's edited files back into the vault (see notes.Service.SyncFromWorkbench) —
    // those paths were NOT overwritten in the vault. Empty when the sync found no conflicts.
    repeated string sync_conflicts = 2;
  }
}

message DeleteWorkbench {
  message Request {
    string vault_id = 1;
  }
  message Response {
    string status = 1;
  }
}

// TerminalTab is one tmux window inside a workbench's tmux session, surfaced to the browser as a
// terminal tab (see domain.TerminalTab). id is tmux's own #{window_id} (e.g. "@1") — stable
// across window renumbering, unlike #{window_index}. There is no user-supplied name anywhere in
// this design: tabs are always auto-named by tmux's automatic-rename.
message TerminalTab {
  string id = 1;
  string name = 2;
  bool active = 3;
}

message ListWorkbenchTerminalTabs {
  message Request {
    string vault_id = 1;
  }
  message Response {
    repeated TerminalTab tabs = 1;
  }
}

message CreateWorkbenchTerminalTab {
  message Request {
    string vault_id = 1;
  }
  message Response {
    TerminalTab tab = 1;
  }
}

message SelectWorkbenchTerminalTab {
  message Request {
    string vault_id = 1;
    string tab_id = 2;
  }
  message Response {}
}

message CloseWorkbenchTerminalTab {
  message Request {
    string vault_id = 1;
    string tab_id = 2;
  }
  message Response {}
}

message EnablePostgresDatabase {
  message Request {
    string vault_id = 1;
  }
  message Response {
    // status: "not_enabled"/"provisioning"/"ready"/"error" (see domain.VaultPostgresStatus).
    string status = 1;
    string error_message = 2;
  }
}

message GetPostgresDatabase {
  message Request {
    string vault_id = 1;
  }
  message Response {
    // status: "not_enabled"/"provisioning"/"ready"/"error" (see domain.VaultPostgresStatus).
    string status = 1;
    string error_message = 2;
  }
}

message DisablePostgresDatabase {
  message Request {
    string vault_id = 1;
  }
  message Response {
    // status: "not_enabled"/"provisioning"/"ready"/"error" (see domain.VaultPostgresStatus).
    string status = 1;
  }
}

message VaultItem {
  string id = 1;
  string name = 2;
  string db_url = 3;
  string livesync_passphrase = 4;
  string s3_instance_id = 5;
  string s3_bucket_name = 6;
  bool use_couchdb_for_binaries = 7;
  bool is_public = 8;
  string slug = 9;
  // role is the calling user's membership role on this vault ("owner"/"reader"/"maintainer"),
  // or "" if they have no membership row (e.g. viewing a public vault as a non-member).
  string role = 10;
  // postgres_enabled/postgres_status mirror EnablePostgresDatabase.Response — status is one of
  // "not_enabled"/"provisioning"/"ready"/"error" (see domain.VaultPostgresStatus).
  bool postgres_enabled = 11;
  string postgres_status = 12;
}

message VaultMemberInfo {
  string id = 1;
  string user_id = 2;
  string email = 3;
  string username = 4;
  string role = 5;
}

message VaultInviteItem {
  string id = 1;
  string vault_id = 2;
  string role = 3;
  string token = 4;
  bool revoked = 5;
  string created_at = 6;
}

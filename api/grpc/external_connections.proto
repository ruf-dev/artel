syntax = "proto3";

package artel_api;

import "google/api/annotations.proto";

option go_package = "/artel_api";

service ExternalConnectionsAPI {
  rpc InitiateGoogleOAuth(InitiateGoogleOAuth.Request) returns (InitiateGoogleOAuth.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/google/initiate"
      body: "*"
    };
  }

  rpc ListConnections(ListConnections.Request) returns (ListConnections.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/list"
      body: "*"
    };
  }

  rpc DisconnectProvider(DisconnectProvider.Request) returns (DisconnectProvider.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/disconnect"
      body: "*"
    };
  }

  // DisconnectConnection removes a single connection by id, for providers (like Trello) that can
  // hold more than one connection per user — DisconnectProvider removes the sole connection for a
  // single-connection provider instead.
  rpc DisconnectConnection(DisconnectConnection.Request) returns (DisconnectConnection.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/disconnect-connection"
      body: "*"
    };
  }

  rpc GetGooglePickerToken(GooglePickerToken.Request) returns (GooglePickerToken.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/google/picker-token"
      body: "*"
    };
  }

  rpc AddSpreadsheet(AddSpreadsheet.Request) returns (AddSpreadsheet.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/google/spreadsheets/add"
      body: "*"
    };
  }

  rpc ListSpreadsheets(ListSpreadsheets.Request) returns (ListSpreadsheets.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/google/spreadsheets/list"
      body: "*"
    };
  }

  rpc RemoveSpreadsheet(RemoveSpreadsheet.Request) returns (RemoveSpreadsheet.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/google/spreadsheets/remove"
      body: "*"
    };
  }

  rpc AddEmailConnection(AddEmailConnection.Request) returns (AddEmailConnection.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/email/add"
      body: "*"
    };
  }

  rpc CheckEmailConnection(CheckEmailConnection.Request) returns (CheckEmailConnection.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/email/check"
      body: "*"
    };
  }

  rpc ListMailServerSuggestions(ListMailServerSuggestions.Request) returns (ListMailServerSuggestions.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/email/suggestions"
      body: "*"
    };
  }

  rpc AddGitlabConnection(AddGitlabConnection.Request) returns (AddGitlabConnection.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/gitlab/add"
      body: "*"
    };
  }

  rpc CheckGitlabConnection(CheckGitlabConnection.Request) returns (CheckGitlabConnection.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/gitlab/check"
      body: "*"
    };
  }

  rpc GenerateGitlabWebhookSecret(GenerateGitlabWebhookSecret.Request) returns (GenerateGitlabWebhookSecret.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/gitlab/webhook-secret"
      body: "*"
    };
  }

  rpc AddTrelloConnection(AddTrelloConnection.Request) returns (AddTrelloConnection.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/trello/add"
      body: "*"
    };
  }

  rpc CheckTrelloConnection(CheckTrelloConnection.Request) returns (CheckTrelloConnection.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/trello/check"
      body: "*"
    };
  }

  rpc AddTelegramConnection(AddTelegramConnection.Request) returns (AddTelegramConnection.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/telegram/add"
      body: "*"
    };
  }

  rpc CheckTelegramConnection(CheckTelegramConnection.Request) returns (CheckTelegramConnection.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/telegram/check"
      body: "*"
    };
  }

  rpc AddAnthropicConnection(AddAnthropicConnection.Request) returns (AddAnthropicConnection.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/anthropic/add"
      body: "*"
    };
  }

  rpc CheckAnthropicConnection(CheckAnthropicConnection.Request) returns (CheckAnthropicConnection.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/anthropic/check"
      body: "*"
    };
  }

  rpc AddOpenAIConnection(AddOpenAIConnection.Request) returns (AddOpenAIConnection.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/openai/add"
      body: "*"
    };
  }

  rpc CheckOpenAIConnection(CheckOpenAIConnection.Request) returns (CheckOpenAIConnection.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/openai/check"
      body: "*"
    };
  }

  rpc AddGenericConnection(AddGenericConnection.Request) returns (AddGenericConnection.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/generic"
      body: "*"
    };
  }

  rpc AddS3Connection(AddS3Connection.Request) returns (AddS3Connection.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/s3/add"
      body: "*"
    };
  }

  rpc CheckS3Connection(CheckS3Connection.Request) returns (CheckS3Connection.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/s3/check"
      body: "*"
    };
  }

  rpc AddCouchDBConnection(AddCouchDBConnection.Request) returns (AddCouchDBConnection.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/couchdb/add"
      body: "*"
    };
  }

  rpc CheckCouchDBConnection(CheckCouchDBConnection.Request) returns (CheckCouchDBConnection.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/couchdb/check"
      body: "*"
    };
  }

  rpc AddPostgresConnection(AddPostgresConnection.Request) returns (AddPostgresConnection.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/postgres/add"
      body: "*"
    };
  }

  rpc CheckPostgresConnection(CheckPostgresConnection.Request) returns (CheckPostgresConnection.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/postgres/check"
      body: "*"
    };
  }

  rpc GetProviderStatistics(GetProviderStatistics.Request) returns (GetProviderStatistics.Response) {
    option (google.api.http) = {
      post: "/api/external-connections/statistics"
      body: "*"
    };
  }
}

enum ExternalProvider {
  EXTERNAL_PROVIDER_UNSPECIFIED = 0;
  EXTERNAL_PROVIDER_GOOGLE_SHEETS = 1;
  EXTERNAL_PROVIDER_TRELLO = 2;
  EXTERNAL_PROVIDER_MIRO = 3;
  EXTERNAL_PROVIDER_EMAIL = 4;
  EXTERNAL_PROVIDER_GITLAB = 5;
  EXTERNAL_PROVIDER_ANTHROPIC = 6;
  EXTERNAL_PROVIDER_TELEGRAM = 7;
  EXTERNAL_PROVIDER_OPENAI = 8;
  EXTERNAL_PROVIDER_S3 = 9;
  EXTERNAL_PROVIDER_COUCHDB = 10;
  EXTERNAL_PROVIDER_POSTGRES = 11;
  EXTERNAL_PROVIDER_OPENROUTER = 12;
}

message GoogleConnectionInfo {
  string email = 1;
  string scopes = 2;
}

message GenericConnection {
  map<string, string> fields = 1;
}

message ExternalConnectionInfo {
  string id = 1;
  ExternalProvider provider = 2;
  string created_at = 3;
  string updated_at = 4;
  oneof details {
    GoogleConnectionInfo google = 5;
    GenericConnection generic = 6;
  }
  string provider_name = 7;
}

message InitiateGoogleOAuth {
  message Request {
    string origin = 1;
  }
  message Response {
    string auth_url = 1;
  }
}

message ListConnections {
  message Request {}
  message Response {
    repeated ExternalConnectionInfo connections = 1;
  }
}

message DisconnectProvider {
  message Request {
    string provider = 1;
  }
  message Response {}
}

message DisconnectConnection {
  message Request {
    string id = 1;
  }
  message Response {}
}

message GooglePickerToken {
  message Request {}
  message Response {
    string access_token = 1;
  }
}

message Spreadsheet {
  string id         = 1;
  string name       = 2;
  string created_at = 3;
}

message AddSpreadsheet {
  message Request {
    string spreadsheet_id = 1;
    string name           = 2;
  }
  message Response {
    Spreadsheet spreadsheet = 1;
  }
}

message ListSpreadsheets {
  message Request {}
  message Response {
    repeated Spreadsheet spreadsheets = 1;
  }
}

message RemoveSpreadsheet {
  message Request {
    string spreadsheet_id = 1;
  }
  message Response {}
}

message AddEmailConnection {
  message Request {
    string email     = 1;
    string imap_host = 2;
    int32  imap_port = 3;
    string smtp_host = 4;
    int32  smtp_port = 5;
    string password  = 6;
  }
  message Response {
    ExternalConnectionInfo connection = 1;
  }
}

message CheckEmailConnection {
  message Request {
    string email     = 1;
    string imap_host = 2;
    int32  imap_port = 3;
    string smtp_host = 4;
    int32  smtp_port = 5;
    string password  = 6;
  }
  message Response {}
}

message MailServerSuggestion {
  string domain           = 1;
  string smtp             = 2;
  int32  smtp_port        = 3;
  string imap             = 4;
  int32  imap_port        = 5;
  string app_password_url = 6;
}

message ListMailServerSuggestions {
  message Request {
    string domain = 1;
  }
  message Response {
    repeated MailServerSuggestion suggestions = 1;
  }
}

message AddGitlabConnection {
  message Request {
    string personal_access_token = 1;
    string instance_url          = 2;
  }
  message Response {
    ExternalConnectionInfo connection = 1;
  }
}

message CheckGitlabConnection {
  message Request {
    string personal_access_token = 1;
    string instance_url          = 2;
  }
  message Response {
    string username = 1;
  }
}

message GenerateGitlabWebhookSecret {
  message Request {
  }
  message Response {
    ExternalConnectionInfo connection = 1;
    string webhook_secret = 2; // one-time reveal; never retrievable again after this response
  }
}

message AddTrelloConnection {
  message Request {
    string api_key   = 1;
    string api_token = 2;
  }
  message Response {
    ExternalConnectionInfo connection = 1;
  }
}

message CheckTrelloConnection {
  message Request {
    string api_key   = 1;
    string api_token = 2;
  }
  message Response {
    string full_name = 1;
  }
}

message AddTelegramConnection {
  message Request {
    string bot_token = 1;
  }
  message Response {
    ExternalConnectionInfo connection = 1;
  }
}

message CheckTelegramConnection {
  message Request {
    string bot_token = 1;
  }
  message Response {
    string bot_username = 1;
  }
}

message AddAnthropicConnection {
  message Request {
    string api_key       = 1;
    string base_url      = 2; // optional; defaults to https://api.anthropic.com
    string default_model = 3; // optional; falls back to a recommended default from the live model list
  }
  message Response {
    ExternalConnectionInfo connection = 1;
  }
}

message CheckAnthropicConnection {
  message Request {
    string api_key       = 1;
    string base_url      = 2;
    // optional; used as the fallback validation target when the provider doesn't
    // support GET /v1/models (common for non-official Anthropic-compatible proxies)
    string default_model = 3;
  }
  message Response {
    repeated string available_models          = 1;
    string           recommended_default_model = 2;
  }
}

message AddOpenAIConnection {
  message Request {
    string api_key       = 1;
    // optional; defaults to https://api.openai.com/v1 — for OpenAI-compatible proxies, include
    // any required path prefix the proxy expects (OpenAI's API is rooted at /v1, unlike Anthropic
    // where base_url is just the host)
    string base_url      = 2;
    string default_model = 3; // optional; falls back to a recommended default from the live model list
    // optional; which OpenAI-compatible identity to persist this key under (EXTERNAL_PROVIDER_OPENAI
    // or EXTERNAL_PROVIDER_OPENROUTER). Unset/UNSPECIFIED defaults to EXTERNAL_PROVIDER_OPENAI —
    // this RPC is reused across every provider that speaks the OpenAI Chat Completions protocol
    // rather than forking a bespoke RPC pair per provider (they all use the same underlying client).
    ExternalProvider provider = 4;
  }
  message Response {
    ExternalConnectionInfo connection = 1;
  }
}

message CheckOpenAIConnection {
  message Request {
    string api_key       = 1;
    string base_url      = 2;
    string default_model = 3; // optional; used as the fallback validation target when the provider doesn't support GET /v1/models
    ExternalProvider provider = 4; // optional; see AddOpenAIConnection.Request.provider
  }
  message Response {
    repeated string available_models          = 1;
    string           recommended_default_model = 2;
  }
}

message AddS3Connection {
  message Request {
    string endpoint    = 1;
    string region      = 2;
    string access_key  = 3;
    string secret_key  = 4;
    bool   use_ssl     = 5;
    bool   path_style  = 6;
  }
  message Response {
    ExternalConnectionInfo connection = 1;
  }
}

message CheckS3Connection {
  message Request {
    string endpoint    = 1;
    string region      = 2;
    string access_key  = 3;
    string secret_key  = 4;
    bool   use_ssl     = 5;
    bool   path_style  = 6;
  }
  message Response {}
}

message AddCouchDBConnection {
  message Request {
    string url      = 1;
    string username = 2;
    string password = 3;
  }
  message Response {
    ExternalConnectionInfo connection = 1;
  }
}

message CheckCouchDBConnection {
  message Request {
    string url      = 1;
    string username = 2;
    string password = 3;
  }
  message Response {}
}

message AddPostgresConnection {
  message Request {
    string host      = 1;
    int32  port      = 2;
    string database  = 3;
    string username  = 4;
    string password  = 5;
    string ssl_mode  = 6;
  }
  message Response {
    ExternalConnectionInfo connection = 1;
  }
}

message CheckPostgresConnection {
  message Request {
    string host      = 1;
    int32  port      = 2;
    string database  = 3;
    string username  = 4;
    string password  = 5;
    string ssl_mode  = 6;
  }
  message Response {}
}

message AddGenericConnection {
  message Request {
    string provider = 1;
    map<string, string> credentials = 2;
  }
  message Response {
    ExternalConnectionInfo connection = 1;
  }
}

message GetProviderStatistics {
  message Request {
    ExternalProvider provider = 1;
  }
  message Response {
    oneof statistics {
      OpenRouterStatistics openrouter = 1;
    }
  }
}

message OpenRouterStatistics {
  double limit = 1;
  bool   limit_unlimited = 2;
  double limit_remaining = 3;
  double usage_total = 4;
  double usage_daily = 5;
  double usage_weekly = 6;
  double usage_monthly = 7;
  bool   is_free_tier = 8;
}

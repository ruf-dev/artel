syntax = "proto3";

package artel_api;

import "google/api/annotations.proto";

option go_package = "/artel_api";

service McpKeysAPI {
    rpc CreateMcpKey(CreateMcpKey.Request) returns (CreateMcpKey.Response) {
        option (google.api.http) = {
            post: "/api/mcp/{vault_id}/mcp-keys"
            body: "*"
        };
    }

    rpc ListMcpKeys(ListMcpKeys.Request) returns (ListMcpKeys.Response) {
        option (google.api.http) = {
            get: "/api/mcp/{vault_id}/mcp-keys"
        };
    }

    rpc RevokeMcpKey(RevokeMcpKey.Request) returns (RevokeMcpKey.Response) {
        option (google.api.http) = {
            delete: "/api/mcp/{vault_id}/mcp-keys/{key_id}"
        };
    }
}

message McpKeyInfo {
    string id          = 1;
    string vault_id    = 2;
    string name        = 3;
    string key_preview = 4;
    string created_at  = 5;
}

message CreateMcpKey {
    message Request {
        string vault_id = 1;
        string name     = 2;
    }
    message Response {
        McpKeyInfo key       = 1;
        string     raw_token = 2;
    }
}

message ListMcpKeys {
    message Request {
        string vault_id = 1;
    }
    message Response {
        repeated McpKeyInfo keys = 1;
    }
}

message RevokeMcpKey {
    message Request {
        string vault_id = 1;
        string key_id   = 2;
    }
    message Response {}
}

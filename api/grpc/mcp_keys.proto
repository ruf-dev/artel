syntax = "proto3";

package artel_api;

import "google/api/annotations.proto";
import "external_connections.proto";

option go_package = "/artel_api";

service McpKeysAPI {
    rpc CreateMcpKey(CreateMcpKey.Request) returns (CreateMcpKey.Response) {
        option (google.api.http) = {
            post: "/api/mcp/keys/create"
            body: "*"
        };
    }

    rpc ListMcpKeys(ListMcpKeys.Request) returns (ListMcpKeys.Response) {
        option (google.api.http) = {
            post: "/api/mcp/keys/list"
            body: "*"
        };
    }

    rpc RevokeMcpKey(RevokeMcpKey.Request) returns (RevokeMcpKey.Response) {
        option (google.api.http) = {
            post: "/api/mcp/keys/revoke"
            body: "*"
        };
    }

    rpc ListUserMcpKeys(ListUserMcpKeys.Request) returns (ListUserMcpKeys.Response) {
        option (google.api.http) = {
            post: "/api/mcp/keys/list-user"
            body: "*"
        };
    }

    rpc SetMcpKeyAccess(SetMcpKeyAccess.Request) returns (SetMcpKeyAccess.Response) {
        option (google.api.http) = {
            post: "/api/mcp/keys/access"
            body: "*"
        };
    }

    rpc ListMcpConnectors(ListMcpConnectors.Request) returns (ListMcpConnectors.Response) {
        option (google.api.http) = {
            post: "/api/mcp/keys/connectors/list"
            body: "*"
        };
    }

    rpc AddMcpConnector(AddMcpConnector.Request) returns (AddMcpConnector.Response) {
        option (google.api.http) = {
            post: "/api/mcp/keys/connectors/add"
            body: "*"
        };
    }

    rpc RemoveMcpConnector(RemoveMcpConnector.Request) returns (RemoveMcpConnector.Response) {
        option (google.api.http) = {
            post: "/api/mcp/keys/connectors/remove"
            body: "*"
        };
    }

    rpc ListMomCandidates(ListMomCandidates.Request) returns (ListMomCandidates.Response) {
        option (google.api.http) = {
            post: "/api/mcp/moms/candidates"
            body: "*"
        };
    }

    rpc ExecuteMomTool(ExecuteMomTool.Request) returns (ExecuteMomTool.Response) {
        option (google.api.http) = {
            post: "/api/mcp/moms/execute"
            body: "*"
        };
    }
}

message McpKeyInfo {
    string id               = 1;
    string vault_id         = 2;
    string name             = 3;
    string key_preview      = 4;
    string created_at       = 5;
    string last_accessed_at = 6;
    string email_account_id = 7;
}

message CreateMcpKey {
    message Request {
        string vault_id = 1;
        string name     = 2;
    }
    message Response {
        McpKeyInfo key       = 1;
        string     raw_token = 2;
    }
}

message ListMcpKeys {
    message Request {
        string vault_id = 1;
    }
    message Response {
        repeated McpKeyInfo keys = 1;
    }
}

message RevokeMcpKey {
    message Request {
        string vault_id = 1;
        string key_id   = 2;
    }
    message Response {}
}

message ListUserMcpKeys {
    message Request {}
    message Response {
        repeated McpKeyInfo keys = 1;
    }
}

message SetMcpKeyAccess {
    message Request {
        string key_id           = 1;
        string vault_id         = 2;
        string email_account_id = 3;
    }
    message Response {}
}

message McpConnectorInfo {
    string mcp_key_id             = 1;
    string mcp_name               = 2;
    string external_connection_id = 3;
    string created_at             = 4;
}

enum SmtpOperation {
    SMTP_OP_UNSPECIFIED = 0;
    SMTP_OP_SEND        = 1;
}

message SmtpToolAction {
    SmtpOperation operation = 1;
}

enum ImapOperation {
    IMAP_OP_UNSPECIFIED    = 0;
    IMAP_OP_LIST_FOLDERS   = 1;
    IMAP_OP_LIST_MESSAGES  = 2;
    IMAP_OP_FETCH_MESSAGE  = 3;
}

message ImapToolAction {
    ImapOperation operation = 1;
}

message StringParam {}

message IntegerParam {}

message EnumParam {
    repeated string values = 1;
}

message ToolParamDef {
    string description = 1;
    oneof kind {
        StringParam  string_param  = 2;
        IntegerParam integer_param = 3;
        EnumParam    enum_param    = 4;
    }
}

message McpToolInfo {
    string name        = 1;
    string description = 2;
    oneof action {
        SmtpToolAction smtp = 3;
        ImapToolAction imap = 4;
    }
    map<string, ToolParamDef> params = 5;
}

message MomCandidate {
    string name        = 1;
    string author      = 2;
    string description = 3;
    repeated ExternalConnectionInfo connections = 4;
    repeated McpToolInfo tools                 = 5;
}

message ListMcpConnectors {
    message Request {
        string key_id = 1;
    }
    message Response {
        repeated McpConnectorInfo connectors = 1;
    }
}

message AddMcpConnector {
    message Request {
        string key_id                 = 1;
        string mcp_name               = 2;
        string external_connection_id = 3;
    }
    message Response {
        McpConnectorInfo connector = 1;
    }
}

message RemoveMcpConnector {
    message Request {
        string key_id   = 1;
        string mcp_name = 2;
    }
    message Response {}
}

message ListMomCandidates {
    message Request {}
    message Response {
        repeated MomCandidate candidates = 1;
    }
}

message ExecuteMomTool {
    message Request {
        string mcp_name               = 1;
        string tool_name              = 2;
        string external_connection_id = 3;
        string params_json            = 4;
    }
    message Response {
        string result = 1;
    }
}

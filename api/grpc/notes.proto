syntax = "proto3";

package artel_notes;

import "google/api/annotations.proto";
import "npm.proto";

option go_package = "/artel_api";
option (npm_package) = "@artel/api";

service NotesAPI {
  rpc ListFolders(ListFolders.Request) returns (ListFolders.Response) {
    option (google.api.http) = {
      post: "/api/notes/folders"
      body: "*"
    };
  };
  rpc ListNotes(ListNotes.Request) returns (ListNotes.Response) {
    option (google.api.http) = {
      post: "/api/notes/list"
      body: "*"
    };
  };
  rpc GetNote(GetNote.Request) returns (GetNote.Response) {
    option (google.api.http) = {
      post: "/api/notes/get"
      body: "*"
    };
  };
  rpc ListTags(ListTags.Request) returns (ListTags.Response) {
    option (google.api.http) = {
      post: "/api/notes/tags"
      body: "*"
    };
  };
  rpc SaveNote(SaveNote.Request) returns (SaveNote.Response) {
    option (google.api.http) = {
      post: "/api/notes/save"
      body: "*"
    };
  };
  rpc MoveNote(MoveNote.Request) returns (MoveNote.Response) {
    option (google.api.http) = {
      post: "/api/notes/move"
      body: "*"
    };
  };
  rpc ExportFolder(ExportFolder.Request) returns (ExportFolder.Response) {
    option (google.api.http) = {
      post: "/api/notes/export"
      body: "*"
    };
  };
  rpc CheckImportConflicts(CheckImportConflicts.Request) returns (CheckImportConflicts.Response) {
    option (google.api.http) = {
      post: "/api/notes/import/check"
      body: "*"
    };
  };
  rpc CommitImport(CommitImport.Request) returns (CommitImport.Response) {
    option (google.api.http) = {
      post: "/api/notes/import/commit"
      body: "*"
    };
  };
  rpc DeleteFolder(DeleteFolder.Request) returns (DeleteFolder.Response) {
    option (google.api.http) = {
      post: "/api/notes/folder/delete"
      body: "*"
    };
  };
  rpc MoveFolder(MoveFolder.Request) returns (MoveFolder.Response) {
    option (google.api.http) = {
      post: "/api/notes/folder/move"
      body: "*"
    };
  };
}

message NoteItem {
  string path = 1;
  int64 mtime = 2;
}

message ListFolders {
  message Request {
    string vault_id = 1;
  }
  message Response {
    repeated string folders = 1;
  }
}

message ListNotes {
  message Request {
    string vault_id = 1;
  }
  message Response {
    repeated NoteItem notes = 1;
  }
}

message GetNote {
  message Request {
    string vault_id = 1;
    string path = 2;
  }
  message Response {
    string content = 1;
  }
}

message ListTags {
  message Request {
    string vault_id = 1;
  }
  message Response {
    repeated string tags = 1;
  }
}

message SaveNote {
  message Request {
    string vault_id = 1;
    string path = 2;
    string content = 3;
  }
  message Response {}
}

message MoveNote {
  message Request {
    string vault_id = 1;
    string old_path = 2;
    string new_path = 3;
  }
  message Response {}
}

message ExportFolder {
  message Request {
    string vault_id = 1;
    string path = 2; // folder path prefix; empty means the whole vault
  }
  message Response {
    bytes zip_data = 1;
  }
}

enum ImportConflictAction {
  SKIP = 0;
  OVERWRITE = 1;
  RENAME = 2;
}

message ImportResolution {
  string path = 1; // conflicting destination path, as reported by CheckImportConflicts
  ImportConflictAction action = 2;
  string rename_to = 3; // only used when action == RENAME
}

message CheckImportConflicts {
  message Request {
    string vault_id = 1;
    string dest_path = 2; // "" or "/" imports at vault root
    bytes zip_data = 3;
  }
  message Response {
    repeated string conflicting_paths = 1;
  }
}

message CommitImport {
  message Request {
    string vault_id = 1;
    string dest_path = 2;
    bytes zip_data = 3;
    repeated ImportResolution resolutions = 4;
  }
  message Response {
    int32 imported_count = 1;
    int32 skipped_count = 2;
  }
}

message DeleteFolder {
  message Request {
    string vault_id = 1;
    string path = 2;
  }
  message Response {
    int32 deleted_count = 1;
    repeated string failed_paths = 2;
  }
}

message MoveFolder {
  message Request {
    string vault_id = 1;
    string old_path = 2;
    string new_path = 3;
  }
  message Response {
    int32 moved_count = 1;
  }
}

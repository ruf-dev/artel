name: branch-push
run-name: ${{ github.REF_NAME }} CI
on:
  push:
    branches:
      - "*"
      - "!master"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: go mod download

      - name: Build frontend
        run: make build-ui

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test ./...

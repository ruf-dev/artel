app_info:
    name: github.com/ruf-dev/artel
    version: v0.0.1
    startup_duration: 10s
environment:
    - name: couchdb_url
      type: string
      value: http://admin:admin@localhost:15984
    - name: log_format
      type: string
      enum: [JSON, TEXT]
      value: TEXT
    - name: log_level
      type: string
      enum: [Trace, Debug, Info, Warn, Error, Fatal, Panic]
      value: Info

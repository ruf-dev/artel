<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artel — Notes Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --coral: #FF4B3E;
    --bg-base: #000000; --bg-card: #0d0d0d; --bg-elevated: #141414;
    --border-dim: rgba(255,255,255,0.06); --border-mid: rgba(255,255,255,0.11);
    --text-primary: rgba(255,255,255,0.92); --text-secondary: rgba(255,255,255,0.55);
    --text-muted: rgba(255,255,255,0.32); --text-disabled: rgba(255,255,255,0.18);
    --font: 'Comfortaa', sans-serif; --font-mono: 'JetBrains Mono', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; color: var(--text-primary); font-family: var(--font); }
  ::-webkit-scrollbar { width: 0; height: 0; }
  * { scrollbar-width: none; }
  @keyframes blinkCaret {
    0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; }
  }
  @keyframes artelPulse {
    0%   { filter: drop-shadow(0 0 0 rgba(255,75,62,0.7)); }
    60%  { filter: drop-shadow(0 0 1.1rem rgba(255,75,62,0)); }
    100% { filter: drop-shadow(0 0 0 rgba(255,75,62,0.7)); }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<!-- Design canvas framework -->
<script type="text/babel" data-presets="react" src="design-canvas.jsx"></script>
<!-- Shared Artel brand components -->
<script type="text/babel" data-presets="react" src="artel-shared.jsx"></script>
<!-- Notes UI layouts -->
<script type="text/babel" data-presets="react" src="notes-layouts.jsx"></script>

<!-- App entry -->
<script type="text/babel" data-presets="react">
function App() {
  return (
    <DesignCanvas>

      <DCSection id="layouts" title="Layout Variations" subtitle="Three approaches — Preview, Raw Edit, Read mode">
        <DCArtboard id="classic" label="A · Classic — Live Preview" width={1280} height={800}>
          <LayoutClassic />
        </DCArtboard>
        <DCArtboard id="focused" label="B · Focused — Raw Edit" width={1280} height={800}>
          <LayoutFocused />
        </DCArtboard>
        <DCArtboard id="panel" label="C · Panel — Read + Backlinks" width={1280} height={800}>
          <LayoutPanel />
        </DCArtboard>
      </DCSection>

      <DCSection id="typography" title="Typography Options" subtitle="Body font pairings for note content">
        <DCArtboard id="t1" label="Comfortaa · brand font" width={460} height={340}>
          <TypoComfortaa />
        </DCArtboard>
        <DCArtboard id="t2" label="JetBrains Mono · source-native" width={460} height={340}>
          <TypoMono />
        </DCArtboard>
        <DCArtboard id="t3" label="Georgia · editorial serif" width={460} height={340}>
          <TypoSerif />
        </DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
